<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Harley Neon Rush</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  html,body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:#05050f; font-family:'Segoe UI',Tahoma,Arial,sans-serif; position:fixed; }
  #game { position:relative; width:100vw; height:100vh; width:100dvw; height:100dvh; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; -webkit-user-drag:none; }

  .ui { position:absolute; z-index:10; color:#fff; font-weight:bold; pointer-events:none; }
  #hearts { top:calc(15px + env(safe-area-inset-top,0px)); left:calc(15px + env(safe-area-inset-left,0px)); font-size:30px; display:flex; gap:6px; }
  .heart { filter:drop-shadow(0 0 8px #ff2d95); transition:transform .3s, opacity .3s; }
  .heart.lost { opacity:.2; transform:scale(.7); filter:grayscale(1); }
  #score { top:calc(18px + env(safe-area-inset-top,0px)); right:calc(15px + env(safe-area-inset-right,0px)); font-size:18px; color:#00f0ff; text-shadow:0 0 15px #00f0ff; line-height:1.4; }
  #speed { bottom:calc(15px + env(safe-area-inset-bottom,0px)); left:calc(15px + env(safe-area-inset-left,0px)); font-size:15px; color:#ff2d95; text-shadow:0 0 12px #ff2d95; }

  #soundToggle {
    position:absolute; bottom:calc(15px + env(safe-area-inset-bottom,0px)); right:calc(15px + env(safe-area-inset-right,0px)); z-index:105;
    width:48px; height:48px; border-radius:50%; font-size:20px;
    background:rgba(0,240,255,.12); border:1.5px solid rgba(0,240,255,.5);
    color:#00f0ff; cursor:pointer; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    touch-action:manipulation; transition:transform .12s;
    display:flex; align-items:center; justify-content:center;
  }
  #soundToggle:active { transform:scale(.9); }
  #soundToggle.off { color:#666; border-color:rgba(100,100,100,.5); background:rgba(60,60,60,.15); }

  .screen {
    position:absolute; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    padding:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px));
    background:radial-gradient(circle at 50% 40%, rgba(30,10,50,.97), rgba(5,5,15,.99));
    color:#fff; text-align:center; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .hidden { display:none !important; }

  h1.logo { font-size:clamp(24px,7vw,46px); background:linear-gradient(90deg,#00f0ff,#ff2d95,#a855f7);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 20px rgba(255,45,149,.6)); letter-spacing:2px; line-height:1.1; }
  h2.logo2 { font-size:clamp(15px,4.5vw,24px); color:#a855f7; text-shadow:0 0 15px #a855f7; margin-top:-8px; }

  .btn {
    padding:16px 36px; font-size:clamp(14px,3.8vw,19px); font-weight:bold; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#00f0ff,#a855f7); border:none; border-radius:50px;
    box-shadow:0 0 25px rgba(0,240,255,.6), 0 6px 0 rgba(80,20,120,.9);
    transition:transform .12s, box-shadow .12s; font-family:inherit;
    position:relative; z-index:100; touch-action:manipulation;
    min-width:190px; max-width:90vw; line-height:1.4;
    -webkit-appearance:none; appearance:none;
  }
  .btn:active, .btn.pressed { transform:translateY(4px) scale(.97); box-shadow:0 0 15px rgba(0,240,255,.4), 0 2px 0 rgba(80,20,120,.9); }
  .btn.ad { background:linear-gradient(135deg,#ffd700,#ff9500); color:#1a1a1a;
    box-shadow:0 0 25px rgba(255,200,0,.7), 0 6px 0 rgba(140,80,0,.9); }
  .btn.small { padding:12px 28px; font-size:15px; background:linear-gradient(135deg,#666,#444);
    box-shadow:0 0 15px rgba(100,100,100,.4), 0 5px 0 #222; min-width:150px; }

  #tutorial { z-index:70; }
  .tut-card {
    width:min(94vw,420px); background:linear-gradient(160deg,rgba(30,15,50,.95),rgba(15,5,30,.95));
    border:2px solid rgba(0,240,255,.5); border-radius:22px; padding:24px 20px;
    box-shadow:0 0 40px rgba(0,240,255,.35); display:flex; flex-direction:column; gap:14px;
    align-items:center;
  }
  .tut-icon-big { font-size:52px; filter:drop-shadow(0 0 20px #00f0ff); }
  .tut-card h2 { font-size:clamp(16px,4.5vw,19px); color:#00f0ff; text-shadow:0 0 15px rgba(0,240,255,.7); line-height:1.4; }
  .tut-card h2 small { display:block; font-size:.8em; color:#a855f7; margin-top:4px; }
  .tut-card p { font-size:clamp(12px,3.5vw,14px); color:#c8c8e8; line-height:1.8; }
  .tut-card p small { display:block; font-size:.82em; color:#8a8ab8; margin-top:3px; direction:ltr; text-align:center; }
  .tut-arrows { display:flex; gap:20px; margin-top:4px; }
  .tut-arrow { font-size:34px; color:#ff2d95; text-shadow:0 0 15px #ff2d95; animation:arrowPulse 1.5s infinite; }
  @keyframes arrowPulse { 0%,100%{opacity:.5; transform:scale(1);} 50%{opacity:1; transform:scale(1.15);} }

  #adScreen { background:#000; z-index:80; }
  #adBox { width:min(92vw,400px); height:60vh; max-height:500px; border:2px solid #ffd700; border-radius:20px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:linear-gradient(135deg,#1a0033,#330066); box-shadow:0 0 40px rgba(255,215,0,.5); padding:20px; }
  #adBox h2 { color:#ffd700; font-size:clamp(18px,4.5vw,20px); text-shadow:0 0 20px #ffd700; line-height:1.4; }
  #adBox h2 small { display:block; font-size:.8em; color:#ff9500; margin-top:2px; direction:ltr; }
  #adTimer { font-size:34px; color:#00f0ff; font-weight:bold; text-shadow:0 0 20px #00f0ff; }
  #adBar { width:100%; height:8px; background:#333; border-radius:4px; overflow:hidden; }
  #adFill { height:100%; width:100%; background:linear-gradient(90deg,#00f0ff,#ffd700); transition:width 1s linear; }
  .adText { color:#aaa; font-size:13px; text-align:center; line-height:1.7; }
  .adText small { display:block; color:#888; font-size:.85em; direction:ltr; margin-top:2px; }

  #finalScore { font-size:clamp(18px,5vw,32px); color:#00f0ff; text-shadow:0 0 20px #00f0ff; line-height:1.4; }
  #finalScore small { display:block; font-size:.6em; color:#a855f7; margin-top:4px; }

  #langToggle {
    position:absolute; top:calc(15px + env(safe-area-inset-top,0px)); right:calc(15px + env(safe-area-inset-right,0px)); z-index:110;
    padding:8px 16px; font-size:13px; font-weight:bold; font-family:inherit;
    background:rgba(0,240,255,.15); border:1.5px solid rgba(0,240,255,.6);
    border-radius:20px; color:#00f0ff; cursor:pointer;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    touch-action:manipulation; transition:transform .12s;
    -webkit-appearance:none; appearance:none;
  }
  #langToggle:active { transform:scale(.92); }

  .credit {
    font-size: 12px;
    color: #8a8ab8;
    letter-spacing: .5px;
    margin-top: 4px;
    direction: ltr;
    font-weight: normal;
    opacity: .85;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }
  .credit b {
    color: #00f0ff;
    text-shadow: 0 0 10px rgba(0,240,255,.6);
  }

  @media (max-height: 600px) {
    #tutorial { gap:10px; padding-top:calc(10px + env(safe-area-inset-top,0px)); }
    .tut-card { padding:16px 14px; gap:10px; }
    .tut-icon-big { font-size:38px; }
    h1.logo { font-size:clamp(22px,6vw,32px); }
    .screen { gap:10px; }
    .btn { padding:12px 28px; min-width:170px; }
    #startTagline { display:none; }
    .credit { font-size:11px; }
  }
  @media (max-width: 350px) {
    .btn { padding:12px 24px; font-size:14px; min-width:160px; }
    #hearts { font-size:24px; }
    #score { font-size:15px; }
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <button id="langToggle" type="button">EN</button>
  <button id="soundToggle" type="button" aria-label="Sound">🔊</button>

  <div class="ui" id="hearts">
    <span class="heart">❤️</span>
    <span class="heart">❤️</span>
  </div>
  <div class="ui" id="score"></div>
  <div class="ui" id="speed"></div>

  <div class="screen" id="startScreen">
    <h1 class="logo">HARLEY NEON</h1>
    <h2 class="logo2">RUSH 🏍️</h2>
    <p id="startTagline" style="color:#b8b8ff; font-size:14px; max-width:320px; line-height:1.9;"></p>
    <button class="btn" id="startBtn" type="button"></button>
    <div class="credit">Made by <b>Hamed</b></div>
  </div>

  <div class="screen hidden" id="tutorial">
    <h1 class="logo" id="tutTitle" style="font-size:clamp(20px,6vw,32px);"></h1>
    <div class="tut-card">
      <div class="tut-icon-big">🏍️</div>
      <h2 id="tutCardTitle"></h2>
      <p id="tutLine1"></p>
      <p id="tutLine2"></p>
      <div class="tut-arrows">
        <span class="tut-arrow">👈</span>
        <span class="tut-arrow" style="animation-delay:.3s;">👉</span>
      </div>
    </div>
    <button class="btn" id="tutBtn" type="button"></button>
    <div class="credit">Made by <b>Hamed</b></div>
  </div>

  <div class="screen hidden" id="gameOver">
    <h1 class="logo" id="goTitle" style="font-size:clamp(24px,6.5vw,40px); -webkit-text-fill-color:#ff2d95; color:#ff2d95;"></h1>
    <div id="finalScore"></div>
    <button class="btn ad" id="reviveBtn" type="button"></button>
    <div class="credit">Made by <b>Hamed</b></div>
  </div>

  <div class="screen hidden" id="adScreen">
    <div id="adBox">
      <h2 id="adTitle"></h2>
      <div id="adTimer">5</div>
      <div id="adBar"><div id="adFill"></div></div>
      <p class="adText" id="adText"></p>
    </div>
  </div>
</div>

<script>
"use strict";

// ==================== Device Detection ====================
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const IS_ANDROID = /Android/.test(navigator.userAgent);
const IS_MOBILE = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || 'ontouchstart' in window;
const IS_TG = !!window.Telegram?.WebApp?.initData;

// ==================== I18N ====================
const I18N = {
  fa: {
    dir:'rtl', lang:'fa', toggleLabel:'EN',
    scoreLabel:'امتیاز', speedUnit:'km/h',
    tagline:'سریع‌ترین موتور هارلی رو برون!<br>از ماشین‌ها رد شو و سکه جمع کن',
    startBtn:'شروع بازی<span style="display:block;font-size:.72em;opacity:.8;font-weight:normal;margin-top:2px;direction:ltr;">START</span>',
    tutTitle:'آموزش بازی',
    tutCardTitle:'کنترل موتور<span style="display:block;font-size:.78em;color:#a855f7;margin-top:3px;direction:ltr;">Control Your Bike</span>',
    tutLine1:'برای تغییر لاین، سمت <b style="color:#ff2d95;">چپ</b> یا <b style="color:#ff2d95;">راست</b> صفحه رو لمس کن.',
    tutLine1en:'Tap the LEFT or RIGHT side of the screen to switch lanes.',
    tutLine2:'می‌تونی انگشتت رو هم به چپ یا راست بکشی.',
    tutLine2en:'You can also swipe your finger left or right.',
    tutBtn:'فهمیدم! 🚀<span style="display:block;font-size:.72em;opacity:.8;font-weight:normal;margin-top:2px;direction:ltr;">GOT IT</span>',
    gameOver:'بازی تموم شد<span style="display:block;font-size:.55em;font-weight:bold;margin-top:4px;direction:ltr;">GAME OVER</span>',
    finalScore:'امتیاز نهایی: <b>{n}</b><small>Final Score: {n}</small>',
    reviveBtn:'📺 تبلیغ ببین و زنده شو<span style="display:block;font-size:.72em;opacity:.85;font-weight:normal;margin-top:2px;direction:ltr;">WATCH AD &amp; REVIVE</span>',
    adTitle:'📺 تبلیغ اسپانسر<span style="display:block;font-size:.75em;color:#ff9500;margin-top:2px;direction:ltr;">Sponsored Ad</span>',
    adText:'اینجا جای تبلیغ شماست<br><span style="color:#00f0ff;">AdGram Sponsor</span><small>Your ad goes here</small>',
  },
  en: {
    dir:'ltr', lang:'en', toggleLabel:'FA',
    scoreLabel:'Score', speedUnit:'km/h',
    tagline:'Ride the fastest Harley.<br>Dodge cars and grab coins.',
    startBtn:'START<span style="display:block;font-size:.72em;opacity:.8;font-weight:normal;margin-top:2px;">شروع بازی</span>',
    tutTitle:'HOW TO MOVE',
    tutCardTitle:'Control Your Bike<span style="display:block;font-size:.78em;color:#a855f7;margin-top:3px;">کنترل موتور</span>',
    tutLine1:'Tap the <b style="color:#ff2d95;">LEFT</b> or <b style="color:#ff2d95;">RIGHT</b> side of the screen to switch lanes.',
    tutLine1en:'',
    tutLine2:'You can also swipe your finger left or right.',
    tutLine2en:'',
    tutBtn:'GOT IT 🚀<span style="display:block;font-size:.72em;opacity:.8;font-weight:normal;margin-top:2px;">فهمیدم</span>',
    gameOver:'GAME OVER<span style="display:block;font-size:.55em;font-weight:bold;margin-top:4px;">بازی تموم شد</span>',
    finalScore:'Final Score: <b>{n}</b><small>امتیاز نهایی: {n}</small>',
    reviveBtn:'📺 WATCH AD &amp; REVIVE<span style="display:block;font-size:.72em;opacity:.85;font-weight:normal;margin-top:2px;">تبلیغ ببین و زنده شو</span>',
    adTitle:'📺 Sponsored Ad<span style="display:block;font-size:.75em;color:#ff9500;margin-top:2px;">تبلیغ اسپانسر</span>',
    adText:'Your ad goes here<br><span style="color:#00f0ff;">AdGram Sponsor</span><small>اینجا جای تبلیغ شماست</small>',
  }
};

let LANG = localStorage.getItem('harley_lang') || 'fa';
const finalScoreEl = document.getElementById('finalScore');
const scoreEl = document.getElementById('score');
const speedEl = document.getElementById('speed');

function applyLang() {
  const t = I18N[LANG];
  document.documentElement.lang = t.lang;
  document.documentElement.dir = t.dir;
  document.getElementById('langToggle').textContent = t.toggleLabel;
  document.getElementById('startTagline').innerHTML = t.tagline;
  document.getElementById('startBtn').innerHTML = t.startBtn;
  document.getElementById('tutTitle').textContent = t.tutTitle;
  document.getElementById('tutCardTitle').innerHTML = t.tutCardTitle;
  document.getElementById('tutLine1').innerHTML = t.tutLine1 + (t.tutLine1en ? `<small>${t.tutLine1en}</small>` : '');
  document.getElementById('tutLine2').innerHTML = t.tutLine2 + (t.tutLine2en ? `<small>${t.tutLine2en}</small>` : '');
  document.getElementById('tutBtn').innerHTML = t.tutBtn;
  document.getElementById('goTitle').innerHTML = t.gameOver;
  document.getElementById('reviveBtn').innerHTML = t.reviveBtn;
  document.getElementById('adTitle').innerHTML = t.adTitle;
  document.getElementById('adText').innerHTML = t.adText;
  finalScoreEl.innerHTML = t.finalScore.replace(/\{n\}/g, GAME.score);
  scoreEl.textContent = `${t.scoreLabel}: ${GAME.score}`;
  speedEl.textContent = `🚀 ${GAME.state==='playing' ? Math.floor(GAME.speed*12) : 0} ${t.speedUnit}`;
}

document.getElementById('langToggle').addEventListener('click', () => {
  LANG = LANG === 'fa' ? 'en' : 'fa';
  localStorage.setItem('harley_lang', LANG);
  applyLang();
});

// ==================== AUDIO ENGINE ====================
const Audio2 = (() => {
  let actx = null, masterGain = null;
  let engineOsc = null, engineOsc2 = null, engineGain = null, engineFilter = null;
  let enabled = localStorage.getItem('harley_sound') !== 'off';
  let engineRunning = false;
  let unlocked = false;

  function init() {
    if (actx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      masterGain = actx.createGain();
      masterGain.gain.value = 0.6;
      masterGain.connect(actx.destination);
    } catch(e) { actx = null; }
  }

  function resume() {
    if (!actx) init();
    if (actx && actx.state === 'suspended') actx.resume().catch(()=>{});
  }

  function unlock() {
    if (unlocked) return;
    init(); resume();
    if (!actx) return;
    try {
      const buffer = actx.createBuffer(1, 1, 22050);
      const source = actx.createBufferSource();
      source.buffer = buffer;
      source.connect(actx.destination);
      source.start(0);
      unlocked = true;
    } catch(e) {}
  }

  function startEngine() {
    if (!enabled || !actx || engineRunning) return;
    try {
      engineRunning = true;
      engineGain = actx.createGain();
      engineGain.gain.value = 0.08;
      engineFilter = actx.createBiquadFilter();
      engineFilter.type = 'lowpass';
      engineFilter.frequency.value = 180;
      engineFilter.Q.value = 2;

      engineOsc = actx.createOscillator();
      engineOsc.type = 'sawtooth';
      engineOsc.frequency.value = 55;

      engineOsc2 = actx.createOscillator();
      engineOsc2.type = 'square';
      engineOsc2.frequency.value = 82;

      const g2 = actx.createGain();
      g2.gain.value = 0.4;

      engineOsc.connect(engineFilter);
      engineOsc2.connect(g2);
      g2.connect(engineFilter);
      engineFilter.connect(engineGain);
      engineGain.connect(masterGain);

      engineOsc.start();
      engineOsc2.start();
    } catch(e) { engineRunning = false; }
  }

  function stopEngine() {
    if (!engineRunning) return;
    try {
      engineOsc.stop(); engineOsc2.stop();
      engineOsc.disconnect(); engineOsc2.disconnect();
      engineFilter.disconnect(); engineGain.disconnect();
    } catch(e) {}
    engineRunning = false;
  }

  function updateEngine(speed) {
    if (!enabled || !engineRunning || !actx) return;
    try {
      const t = actx.currentTime;
      const norm = Math.min(speed / 40, 1);
      engineOsc.frequency.setTargetAtTime(55 + norm * 90, t, 0.15);
      engineOsc2.frequency.setTargetAtTime(82 + norm * 130, t, 0.15);
      engineFilter.frequency.setTargetAtTime(180 + norm * 400, t, 0.15);
      engineGain.gain.setTargetAtTime(0.06 + norm * 0.06, t, 0.2);
    } catch(e) {}
  }

  function beep(freq, dur, type='sine', vol=0.15, slideTo=null) {
    if (!enabled || !actx) return;
    try {
      const t = actx.currentTime;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t + dur + 0.02);
    } catch(e) {}
  }

  function coin() { beep(880, 0.08, 'sine', 0.12); setTimeout(() => beep(1320, 0.1, 'sine', 0.1), 60); }
  function crash() {
    if (!enabled || !actx) return;
    try {
      const t = actx.currentTime;
      const o = actx.createOscillator();
      const g = actx.createGain();
      const f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 800;
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(180, t);
      o.frequency.exponentialRampToValueAtTime(40, t + 0.35);
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(f); f.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t + 0.4);
    } catch(e) {}
  }
  function gameOver() {
    if (!enabled || !actx) return;
    [523, 392, 330, 262].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'triangle', 0.14), i * 130));
  }
  function swipe(dir=1) { beep(dir > 0 ? 660 : 560, 0.06, 'sine', 0.06); }
  function start() { beep(523, 0.1, 'triangle', 0.13); setTimeout(() => beep(784, 0.15, 'triangle', 0.15), 110); }

  function setEnabled(v) {
    enabled = v;
    localStorage.setItem('harley_sound', v ? 'on' : 'off');
    if (!v) stopEngine();
    else if (GAME.state === 'playing') startEngine();
  }

  return { init, resume, unlock, startEngine, stopEngine, updateEngine, coin, crash, gameOver, swipe, start, setEnabled, get enabled() { return enabled; } };
})();

function unlockAudioOnce() {
  Audio2.unlock();
  document.removeEventListener('touchstart', unlockAudioOnce);
  document.removeEventListener('touchend', unlockAudioOnce);
  document.removeEventListener('mousedown', unlockAudioOnce);
  document.removeEventListener('click', unlockAudioOnce);
  document.removeEventListener('keydown', unlockAudioOnce);
}
document.addEventListener('touchstart', unlockAudioOnce, { passive: true });
document.addEventListener('touchend', unlockAudioOnce, { passive: true });
document.addEventListener('mousedown', unlockAudioOnce);
document.addEventListener('click', unlockAudioOnce);
document.addEventListener('keydown', unlockAudioOnce);

// ==================== Canvas ====================
const canvas = document.getElementById('canvas');
let ctx;
try {
  ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  if (!ctx) ctx = canvas.getContext('2d');
} catch(e) { ctx = canvas.getContext('2d'); }

let W = window.innerWidth, H = window.innerHeight;
let DPR = Math.min(window.devicePixelRatio || 1, 2);

const IS_LOW_END = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) ||
                    (navigator.deviceMemory && navigator.deviceMemory <= 2);
if (IS_LOW_END) DPR = Math.min(DPR, 1.5);

function getViewport() {
  const vv = window.visualViewport;
  const w = vv ? vv.width : window.innerWidth;
  const h = vv ? vv.height : window.innerHeight;
  return { w, h };
}

function resize() {
  const { w, h } = getViewport();
  W = Math.floor(w); H = Math.floor(h);
  DPR = Math.min(window.devicePixelRatio || 1, IS_LOW_END ? 1.5 : 2);
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildGradients();
  if (player.w === 0) initPlayer();
  else {
    player.w = Math.min(W*0.15, 64);
    player.h = player.w*1.7;
    player.y = H*0.74;
    player.targetX = W/2 + player.lane*(W*0.28);
  }
  initStars(); initRoadLines();
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => setTimeout(resize, 100));
  window.visualViewport.addEventListener('scroll', () => setTimeout(resize, 100));
}

let skyGrad, roadGrad;
function buildGradients() {
  skyGrad = ctx.createLinearGradient(0, 0, 0, H*0.4);
  skyGrad.addColorStop(0, '#0a0420');
  skyGrad.addColorStop(0.5, '#1a0a30');
  skyGrad.addColorStop(1, '#2a0a3a');
  roadGrad = ctx.createLinearGradient(0, H*0.35, 0, H);
  roadGrad.addColorStop(0, '#0f0f1f');
  roadGrad.addColorStop(1, '#1a0a2a');
}

// ==================== GAME ====================
const GAME = {
  state: 'start', score: 0,
  baseSpeed: 11, speed: 11, maxSpeed: 40,
  lives: 2, maxLives: 2,
  distance: 0, shake: 0, time: 0, invincible: 0,
};

const player = { x:0, y:0, w:0, h:0, lane:0, targetX:0, tilt:0, wheelAngle:0 };

function initPlayer() {
  player.w = Math.min(W * 0.15, 64);
  player.h = player.w * 1.7;
  player.x = W / 2; player.y = H * 0.74;
  player.targetX = W / 2; player.lane = 0;
}

let obstacles = [], coins = [], particles = [], stars = [], roadLines = [];

function initStars() {
  stars = [];
  const count = IS_LOW_END ? 25 : (W < 500 ? 40 : 60);
  for (let i = 0; i < count; i++) {
    stars.push({ x:Math.random()*W, y:Math.random()*H*0.5, r:Math.random()*1.5+0.5,
      a:Math.random()*0.7+0.3, tw:Math.random()*Math.PI*2, hue: Math.random()>0.5?190:320 });
  }
}
function initRoadLines() {
  roadLines = [];
  const count = 12;
  const spacing = H / count;
  for (let i = 0; i < count; i++) roadLines.push({ y: i*spacing, len: spacing*0.55 });
}

let spawnTimer = 0, coinTimer = 0, patternTimer = 0;

function laneX(lane) { return W/2 + lane*(W*0.28); }

function spawnObstacle(forcedLane) {
  const lane = forcedLane !== undefined ? forcedLane : [-1, 0, 1][Math.floor(Math.random()*3)];
  const isTruck = Math.random() < 0.35;
  obstacles.push({
    lane, x: laneX(lane), y: -140,
    w: isTruck ? player.w*1.35 : player.w*1.0,
    h: isTruck ? player.h*1.25 : player.h*0.9,
    hue: [0, 45, 120, 200, 280][Math.floor(Math.random()*5)],
    hit: false,
  });
}
function spawnTwin() {
  const freeLane = [-1, 0, 1][Math.floor(Math.random()*3)];
  for (const l of [-1, 0, 1]) if (l !== freeLane) spawnObstacle(l);
}
function spawnCoin() {
  const lane = [-1, 0, 1][Math.floor(Math.random()*3)];
  coins.push({ lane, x: laneX(lane), y:-60, r: player.w*0.22,
    phase: Math.random()*Math.PI*2, collected:false });
}

const MAX_PARTICLES = IS_LOW_END ? 40 : 80;
function addParticle(x, y, hue, life=30, size=3) {
  if (particles.length >= MAX_PARTICLES) return;
  particles.push({ x, y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4-2, life, maxLife:life, hue, size });
}
function explosion(x, y, hue) {
  const n = IS_LOW_END ? 10 : 18;
  for (let i = 0; i < n; i++) {
    if (particles.length >= MAX_PARTICLES) break;
    const a = (i/n)*Math.PI*2;
    particles.push({ x, y, vx:Math.cos(a)*(3+Math.random()*5), vy:Math.sin(a)*(3+Math.random()*5),
      life:40, maxLife:40, hue, size:3+Math.random()*3 });
  }
}

// ==================== Input ====================
function moveLane(dir) {
  if (GAME.state !== 'playing') return;
  let moved = false;
  if (dir === -1 && player.lane > -1) { player.lane--; moved = true; }
  if (dir === 1 && player.lane < 1) { player.lane++; moved = true; }
  player.targetX = laneX(player.lane);
  player.tilt = dir * 0.3;
  if (moved) Audio2.swipe(dir);
}

let touchStartX = 0, touchActive = false;

canvas.addEventListener('touchstart', e => {
  if (GAME.state !== 'playing') return;
  e.preventDefault();
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchActive = true;
  const relX = t.clientX / W;
  if (relX < 0.4) moveLane(-1);
  else if (relX > 0.6) moveLane(1);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  if (!touchActive || GAME.state !== 'playing') return;
  e.preventDefault();
  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  if (Math.abs(dx) > 40) {
    moveLane(dx > 0 ? 1 : -1);
    touchStartX = t.clientX;
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  touchActive = false;
}, { passive: false });

canvas.addEventListener('touchcancel', () => { touchActive = false; }, { passive: false });

canvas.addEventListener('click', e => {
  if (GAME.state !== 'playing') return;
  const relX = e.clientX / W;
  if (relX < 0.4) moveLane(-1);
  else if (relX > 0.6) moveLane(1);
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
});

document.addEventListener('touchmove', e => {
  if (e.target === canvas) e.preventDefault();
}, { passive: false });

// ==================== UI ====================
const heartsEl = document.getElementById('hearts');
const startScreen = document.getElementById('startScreen');
const tutorialScreen = document.getElementById('tutorial');
const gameOverScreen = document.getElementById('gameOver');
const adScreen = document.getElementById('adScreen');

function updateHearts() {
  heartsEl.querySelectorAll('.heart').forEach((h, i) => h.classList.toggle('lost', i >= GAME.lives));
}

// ==================== Flow ====================
function startGame() {
  GAME.state = 'playing';
  GAME.score = 0; GAME.speed = GAME.baseSpeed;
  GAME.lives = GAME.maxLives; GAME.distance = 0;
  GAME.shake = 0; GAME.invincible = 60; GAME.time = 0;
  obstacles.length = 0; coins.length = 0; particles.length = 0;
  spawnTimer = 0; coinTimer = 0; patternTimer = 100;
  initPlayer(); updateHearts();
  startScreen.classList.add('hidden');
  tutorialScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  adScreen.classList.add('hidden');
  Audio2.unlock(); Audio2.resume();
  Audio2.start();
  setTimeout(() => { if (GAME.state === 'playing') Audio2.startEngine(); }, 200);
}

function takeHit() {
  if (GAME.invincible > 0) return;
  GAME.lives--; GAME.invincible = 90; GAME.shake = 22;
  explosion(player.x, player.y, 0);
  Audio2.crash();
  if (tg) try { tg.HapticFeedback?.impactOccurred('heavy'); } catch(e){}
  updateHearts();
  if (GAME.lives <= 0) die();
}

function die() {
  GAME.state = 'dead'; GAME.speed = 0;
  explosion(player.x, player.y, 300);
  Audio2.stopEngine();
  Audio2.gameOver();
  if (tg) try { tg.HapticFeedback?.notificationOccurred('error'); } catch(e){}
  const t = I18N[LANG];
  finalScoreEl.innerHTML = t.finalScore.replace(/\{n\}/g, GAME.score);
  gameOverScreen.classList.remove('hidden');
}

function reviveWithAd() {
  // موقتاً فقط تبلیغ نمایشی قدیمی را اجرا می‌کند
  showFakeAd(() => {
    GAME.lives = 1; GAME.invincible = 120; GAME.state = 'playing';
    gameOverScreen.classList.add('hidden');
    Audio2.startEngine();
    updateHearts();
  });
}

function showFakeAd(callback) {
  adScreen.classList.remove('hidden');
  let sec = 5;
  const timerEl = document.getElementById('adTimer');
  const fillEl = document.getElementById('adFill');
  timerEl.textContent = sec; fillEl.style.width = '100%';
  const iv = setInterval(() => {
    sec--; timerEl.textContent = Math.max(0, sec);
    fillEl.style.width = (sec/5*100) + '%';
    if (sec <= 0) { clearInterval(iv); adScreen.classList.add('hidden'); callback(); }
  }, 1000);
}

function bindBtn(id, handler) {
  const el = document.getElementById(id);
  if (!el) return;
  let touched = false;

  el.addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation();
    touched = true;
    el.classList.add('pressed');
    if (window.navigator.vibrate) try { window.navigator.vibrate(10); } catch(e) {}
  }, { passive: false });

  el.addEventListener('touchend', e => {
    e.preventDefault(); e.stopPropagation();
    el.classList.remove('pressed');
    if (touched) { touched = false; handler(); }
  }, { passive: false });

  el.addEventListener('touchcancel', () => {
    el.classList.remove('pressed');
    touched = false;
  }, { passive: false });

  el.addEventListener('click', e => {
    if (touched) return;
    e.preventDefault(); e.stopPropagation();
    handler();
  });
}

bindBtn('startBtn', () => {
  Audio2.unlock();
  startScreen.classList.add('hidden');
  tutorialScreen.classList.remove('hidden');
});
bindBtn('tutBtn', () => startGame());
bindBtn('reviveBtn', () => reviveWithAd());

// ==================== Update ====================
function update() {
  GAME.time++;

  const starSpeed = GAME.speed * 0.5;
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    s.tw += 0.05; s.y += starSpeed;
    if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
  }
  for (let i = 0; i < roadLines.length; i++) {
    roadLines[i].y += GAME.speed;
    if (roadLines[i].y > H) roadLines[i].y -= H;
  }

  player.x += (player.targetX - player.x) * 0.22;
  player.tilt += (0 - player.tilt) * 0.15;
  player.wheelAngle += GAME.speed * 0.18;
  if (GAME.invincible > 0) GAME.invincible--;

  if (GAME.state === 'playing') {
    GAME.speed = Math.min(GAME.maxSpeed, GAME.baseSpeed + GAME.distance*0.0011);
    GAME.distance += GAME.speed;
    Audio2.updateEngine(GAME.speed);

    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = Math.max(16, 45 - GAME.speed*1.4) + Math.random()*18;
    }

    patternTimer--;
    if (patternTimer <= 0 && GAME.distance > 1500) {
      spawnTwin();
      patternTimer = 300 + Math.random()*200 - GAME.speed*5;
      if (patternTimer < 150) patternTimer = 150;
    }

    coinTimer--;
    if (coinTimer <= 0) { spawnCoin(); coinTimer = 35 + Math.random()*40; }
  }

  for (let i = obstacles.length-1; i >= 0; i--) {
    const o = obstacles[i]; o.y += GAME.speed;
    if (o.y > H+150) { obstacles.splice(i,1); continue; }
    if (!o.hit && GAME.state === 'playing' && GAME.invincible <= 0) {
      const dx = Math.abs(o.x - player.x), dy = Math.abs(o.y - player.y);
      if (dx < (o.w + player.w)*0.35 && dy < (o.h + player.h)*0.4) {
        o.hit = true; takeHit(); obstacles.splice(i,1);
      }
    }
  }

  for (let i = coins.length-1; i >= 0; i--) {
    const c = coins[i]; c.y += GAME.speed; c.phase += 0.18;
    if (c.y > H+60) { coins.splice(i,1); continue; }
    if (!c.collected && GAME.state === 'playing') {
      const dx = Math.abs(c.x - player.x), dy = Math.abs(c.y - player.y);
      if (dx < (c.r + player.w*0.5) && dy < (c.r + player.h*0.4)) {
        c.collected = true; GAME.score += 10;
        for (let p = 0; p < 6; p++) addParticle(c.x, c.y, 50, 25, 3);
        Audio2.coin();
        if (tg) try { tg.HapticFeedback?.impactOccurred('light'); } catch(e){}
        coins.splice(i,1);
      }
    }
  }

  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }
  if (GAME.shake > 0) GAME.shake *= 0.85;

  if (GAME.state === 'playing') {
    const t = I18N[LANG];
    scoreEl.textContent = `${t.scoreLabel}: ${GAME.score}`;
    speedEl.textContent = `🚀 ${Math.floor(GAME.speed*12)} ${t.speedUnit}`;
  }
}

// ==================== Draw ====================
function drawBackground() {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H*0.4);

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const alpha = s.a * (0.5 + 0.5*Math.sin(s.tw));
    ctx.fillStyle = s.hue === 190 ? `rgba(0,240,255,${alpha})` : `rgba(255,45,149,${alpha})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }

  ctx.fillStyle = roadGrad;
  ctx.fillRect(0, H*0.35, W, H*0.65);

  const laneW = W*0.28, cx = W/2;
  const roadLeft = cx - laneW*1.5, roadRight = cx + laneW*1.5;

  ctx.shadowColor = '#ff2d95'; ctx.shadowBlur = 12;
  ctx.strokeStyle = 'rgba(255,45,149,0.6)'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(roadLeft, H*0.4); ctx.lineTo(roadLeft - laneW*0.3, H);
  ctx.moveTo(roadRight, H*0.4); ctx.lineTo(roadRight + laneW*0.3, H);
  ctx.stroke();

  ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 8;
  ctx.strokeStyle = 'rgba(0,240,255,0.45)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let l = -1; l <= 1; l++) {
    const x = cx + l*laneW;
    for (let i = 0; i < roadLines.length; i++) {
      const rl = roadLines[i];
      ctx.moveTo(x, rl.y);
      ctx.lineTo(x, rl.y + rl.len);
    }
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawObstacle(o) {
  const w = o.w, h = o.h;
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.shadowColor = `hsl(${o.hue},100%,60%)`;
  ctx.shadowBlur = 14;
  const grad = ctx.createLinearGradient(-w/2, 0, w/2, 0);
  grad.addColorStop(0, `hsl(${o.hue},80%,25%)`);
  grad.addColorStop(0.5, `hsl(${o.hue},90%,55%)`);
  grad.addColorStop(1, `hsl(${o.hue},80%,25%)`);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 10); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,240,255,0.35)';
  ctx.beginPath(); ctx.roundRect(-w*0.3, -h*0.32, w*0.6, h*0.28, 6); ctx.fill();
  ctx.strokeStyle = `hsl(${o.hue},100%,75%)`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-w*0.35, -h*0.05); ctx.lineTo(w*0.35, -h*0.05); ctx.stroke();
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-w*0.28, h*0.38, w*0.09, 0, Math.PI*2);
  ctx.arc(w*0.28, h*0.38, w*0.09, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowColor = '#ff2d95'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#ff2d95';
  ctx.beginPath();
  ctx.arc(-w*0.28, -h*0.4, w*0.07, 0, Math.PI*2);
  ctx.arc(w*0.28, -h*0.4, w*0.07, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawCoin(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  const scale = 0.6 + 0.4*Math.abs(Math.sin(c.phase));
  ctx.scale(scale, 1);
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 15;
  const grad = ctx.createRadialGradient(0,0,0,0,0,c.r);
  grad.addColorStop(0, '#fff8c0');
  grad.addColorStop(0.6, '#ffd700');
  grad.addColorStop(1, '#ff9500');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#b8860b';
  ctx.font = `bold ${c.r*1.2}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('$', 0, 1);
  ctx.restore();
}

function drawHarley(x, y, w, h, tilt, wheelAngle, alpha) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.rotate(tilt);
  const chrome = '#c8d0e0';
  const neonPink = '#ff2d95';
  const neonCyan = '#00f0ff';

  ctx.save(); ctx.translate(0, h*0.36); ctx.rotate(wheelAngle);
  ctx.shadowColor = neonCyan; ctx.shadowBlur = 12;
  ctx.fillStyle = '#08080a';
  ctx.beginPath(); ctx.ellipse(0, 0, w*0.24, w*0.19, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = neonCyan; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = chrome; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i/6)*Math.PI*2;
    ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*w*0.18, Math.sin(a)*w*0.14);
  }
  ctx.stroke();
  ctx.restore();

  ctx.save(); ctx.translate(0, -h*0.36); ctx.rotate(wheelAngle);
  ctx.shadowColor = neonPink; ctx.shadowBlur = 12;
  ctx.fillStyle = '#08080a';
  ctx.beginPath(); ctx.ellipse(0, 0, w*0.24, w*0.19, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = neonPink; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = chrome; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i/6)*Math.PI*2;
    ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*w*0.18, Math.sin(a)*w*0.14);
  }
  ctx.stroke();
  ctx.restore();

  ctx.shadowColor = neonPink; ctx.shadowBlur = 15;
  const bodyGrad = ctx.createLinearGradient(-w*0.3, 0, w*0.3, 0);
  bodyGrad.addColorStop(0, '#0a0a15');
  bodyGrad.addColorStop(0.5, '#2a1a3a');
  bodyGrad.addColorStop(1, '#0a0a15');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(-w*0.22, -h*0.28);
  ctx.quadraticCurveTo(-w*0.32, 0, -w*0.20, h*0.28);
  ctx.lineTo(w*0.20, h*0.28);
  ctx.quadraticCurveTo(w*0.32, 0, w*0.22, -h*0.28);
  ctx.quadraticCurveTo(0, -h*0.38, -w*0.22, -h*0.28);
  ctx.closePath(); ctx.fill();

  const tankGrad = ctx.createLinearGradient(-w*0.2, -h*0.1, w*0.2, -h*0.1);
  tankGrad.addColorStop(0, '#3a1a4a');
  tankGrad.addColorStop(0.5, '#7a2a8a');
  tankGrad.addColorStop(1, '#3a1a4a');
  ctx.fillStyle = tankGrad;
  ctx.beginPath(); ctx.ellipse(0, -h*0.05, w*0.24, h*0.13, 0, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = neonCyan; ctx.lineWidth = 2;
  ctx.shadowColor = neonCyan; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(-w*0.15, -h*0.05); ctx.lineTo(w*0.15, -h*0.05); ctx.stroke();

  ctx.shadowColor = neonPink; ctx.shadowBlur = 8;
  ctx.fillStyle = '#1a0a1a';
  ctx.beginPath(); ctx.ellipse(0, h*0.13, w*0.22, h*0.06, 0, 0, Math.PI*2); ctx.fill();

  ctx.shadowColor = '#fff'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, -h*0.32, w*0.10, 0, Math.PI*2); ctx.fill();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = chrome; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-w*0.28, -h*0.30);
  ctx.quadraticCurveTo(-w*0.32, -h*0.36, 0, -h*0.36);
  ctx.quadraticCurveTo(w*0.32, -h*0.36, w*0.28, -h*0.30);
  ctx.stroke();

  ctx.restore();
}

function drawParticles() {
  if (particles.length === 0) return;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = p.life / p.maxLife;
    ctx.fillStyle = `hsla(${p.hue},100%,65%,${a})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*a, 0, Math.PI*2); ctx.fill();
  }
}

function render() {
  ctx.save();
  if (GAME.shake > 1) {
    ctx.translate((Math.random()-0.5)*GAME.shake, (Math.random()-0.5)*GAME.shake);
  }
  drawBackground();
  for (let i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);
  for (let i = 0; i < coins.length; i++) drawCoin(coins[i]);
  drawParticles();
  if (GAME.state === 'playing' || GAME.state === 'dead') {
    const blink = GAME.invincible > 0 && (GAME.time & 4) ? 0.4 : 1;
    drawHarley(player.x, player.y, player.w, player.h, player.tilt, player.wheelAngle, blink);
  }
  ctx.restore();
}

// ==================== Loop ====================
let lastTime = performance.now();
let accumulator = 0;
const STEP = 1000/60;
let rafId = null;

function loop(now) {
  const dt = Math.min(now - lastTime, 100);
  lastTime = now;
  accumulator += dt;
  let updated = 0;
  while (accumulator >= STEP && updated < 3) {
    update();
    accumulator -= STEP;
    updated++;
  }
  if (updated === 3) accumulator = 0;
  render();
  rafId = requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    Audio2.stopEngine();
  } else {
    lastTime = performance.now();
    accumulator = 0;
    if (!rafId) rafId = requestAnimationFrame(loop);
    if (GAME.state === 'playing') { Audio2.resume(); Audio2.startEngine(); }
  }
});

document.addEventListener('contextmenu', e => e.preventDefault());

let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// ==================== INIT ====================
resize();
applyLang();
rafId = requestAnimationFrame(loop);
setTimeout(resize, 50);
setTimeout(resize, 300);
setTimeout(resize, 800);

console.log('[Harley]', { IS_IOS, IS_ANDROID, IS_MOBILE, IS_TG, IS_LOW_END, DPR });
</script>
